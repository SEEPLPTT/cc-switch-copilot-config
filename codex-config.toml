notify = ["turn-enabled"]
model_provider = "custom"
model = "gpt-5-mini"
model_reasoning_effort = "high"
disable_response_storage = true
web_search = "disabled"

[desktop]
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_COMMANDS"
localeOverride = "zh-CN"
sansFontSize = 14
codeFontSize = 13
ambient-suggestions-enabled = false

[marketplaces.openai-bundled]
source_type = "local"
source = "\\\\?\\C:\\Users\\Admin (无密码) \\.codex\\tmp\\bundled-marketplaces\\openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "\\\\?\\C:\\Users\\Admin (无密码) \\.cache\\codex-runtimes\\codex-primary-runtime\\plugins\\openai-primary-runtime"

# ========== MODEL PROVIDERS CONFIGURATION ==========

# GitHub Copilot Custom Provider
[model.providers.custom]
name = "github-copilot"
base_url = "https://api.githubcopilot.com"
wire_api = "responses"
api_key_env = "GITHUB_COPILOT_TOKEN"

# OpenAI GPT Models
[model.providers.openai]
name = "openai"
base_url = "https://api.openai.com/v1"
wire_api = "openai"
api_key_env = "OPENAI_API_KEY"

# Google Gemini Models
[model.providers.gemini]
name = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta"
wire_api = "google"
api_key_env = "GEMINI_API_KEY"

# ========== AVAILABLE MODELS MAPPING ==========

[models.gpt]
"gpt-5-mini" = { provider = "openai", name = "GPT-5 Mini", cost_tier = "low", capabilities = ["chat", "code"] }
"gpt-5.3-codex" = { provider = "openai", name = "GPT-5.3-Codex", cost_tier = "medium", capabilities = ["chat", "code", "reasoning"] }
"gpt-5.4" = { provider = "openai", name = "GPT-5.4", cost_tier = "medium", capabilities = ["chat", "code", "reasoning", "long_context"] }
"gpt-5.5" = { provider = "openai", name = "GPT-5.5", cost_tier = "high", capabilities = ["chat", "code", "reasoning", "agent"] }
"gpt-5.6" = { provider = "openai", name = "GPT-5.6 Luna", cost_tier = "high", capabilities = ["chat", "code", "reasoning", "multimodal"] }
"gpt-6" = { provider = "openai", name = "GPT-6", cost_tier = "premium", capabilities = ["chat", "code", "reasoning", "agent"] }

[models.gemini]
"gemini-2.5-flash" = { provider = "gemini", name = "Gemini 2.5 Flash", cost_tier = "low", capabilities = ["chat", "code"] }
"gemini-2.5-flash-lite" = { provider = "gemini", name = "Gemini 2.5 Flash Lite", cost_tier = "very_low", capabilities = ["chat"] }
"gemini-2.5-pro" = { provider = "gemini", name = "Gemini 2.5 Pro", cost_tier = "medium", capabilities = ["chat", "code", "reasoning", "long_context"] }

# ========== ROUTING RULES ==========

[routing]
default_provider = "openai"
default_model = "gpt-5-mini"

[[routing.rules]]
name = "code_generation"
when = { task = "code" }
use = { provider = "openai", model = "gpt-5.3-codex" }

[[routing.rules]]
name = "fast_response"
when = { latency = "low" }
use = { provider = "gemini", model = "gemini-2.5-flash" }

[[routing.rules]]
name = "high_quality"
when = { quality = "high" }
use = { provider = "openai", model = "gpt-5.4" }

[[routing.rules]]
name = "reasoning_task"
when = { reasoning = "deep" }
use = { provider = "openai", model = "gpt-5.5" }

[[routing.rules]]
name = "low_cost"
when = { budget = "low" }
use = { provider = "gemini", model = "gemini-2.5-flash-lite" }

# ========== PLUGINS ==========

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."document@openai-primary-runtime"]
enabled = true
